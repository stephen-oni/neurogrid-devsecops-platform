<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroGrid OS // Neural Implant Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #070913;
            --bg-card: rgba(14, 20, 36, 0.85);
            --cyan: #00f0ff;
            --pink: #ff007f;
            --purple: #8a2be2;
            --green: #00ff88;
            --amber: #ffaa00;
            --red: #ff3344;
            --text-main: #d0f7ff;
            --text-dim: #5c7f99;
            --border-glow: rgba(0, 240, 255, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 25%, rgba(0, 240, 255, 0.12), transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(255, 0, 127, 0.1), transparent 45%),
                linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.85));
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.6;
        }

        header {
            border-bottom: 1px solid var(--border-glow);
            background: rgba(7, 9, 19, 0.85);
            backdrop-filter: blur(12px);
            padding: 1rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }

        .brand-badge {
            background: var(--pink);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.8rem;
            padding: 0.25rem 0.6rem;
            letter-spacing: 2px;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 12px var(--cyan);
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-link {
            color: var(--text-dim);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .nav-link:hover { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--red);
            color: var(--red);
            padding: 0.35rem 0.8rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: var(--red);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 51, 68, 0.5);
        }

        main {
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            padding: 3rem 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 6px;
            padding: 2.5rem;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
            position: relative;
        }

        .card::before {
            content: "SCREENING PROTOCOL // NKCA-FORM-04";
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--bg-base);
            padding: 0 8px;
            font-size: 0.75rem;
            color: var(--pink);
            border-left: 2px solid var(--pink);
            border-right: 2px solid var(--pink);
            letter-spacing: 2px;
        }

        .form-header {
            margin-bottom: 2rem;
        }

        .form-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .form-title span { color: var(--cyan); text-shadow: 0 0 15px rgba(0, 240, 255, 0.6); }

        .form-subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-input {
            background: rgba(7, 9, 19, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 4px;
            padding: 0.8rem 1rem;
            color: var(--cyan);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .btn-submit {
            width: 100%;
            background: var(--pink);
            color: #fff;
            border: 1px solid var(--pink);
            padding: 1rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        .btn-submit:hover {
            background: transparent;
            color: var(--pink);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.8), inset 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .alert-box {
            display: none;
            padding: 0.8rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .alert-error { background: rgba(255, 51, 68, 0.15); border: 1px solid var(--red); color: var(--red); }
        .alert-success { background: rgba(0, 255, 136, 0.15); border: 1px solid var(--green); color: var(--green); }

        footer {
            border-top: 1px solid rgba(0, 240, 255, 0.15);
            padding: 1.2rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-dim);
            background: rgba(7, 9, 19, 0.95);
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand">
            <span class="brand-badge">NKCA</span>
            <span class="brand-title">NEUROGRID OS</span>
        </a>
        <div class="user-panel">
            <a href="neural-network.html" class="nav-link">Relay Map</a>
            <span style="font-size: 0.85rem; color: var(--green);">OPERATIVE: <strong id="logged-user" style="color:#fff;">--</strong></span>
            <button onclick="handleLogout()" class="btn-logout">LOGOUT</button>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="form-header">
                <h1 class="form-title">Neural Implant <span>Compatibility Form</span></h1>
                <p class="form-subtitle">Transmit 4-factor biological telemetry metrics directly to the central RDS evaluation pipeline.</p>
            </div>

            <div id="alert-box" class="alert-box"></div>

            <form id="eligibility-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="synapse_speed_ms">Synapse Response Speed (ms)</label>
                        <input type="number" id="synapse_speed_ms" class="form-input" min="1" max="150" placeholder="e.g. 18 (Lower is faster)" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="rejection_tolerance_pct">Rejection Tolerance (%)</label>
                        <input type="number" id="rejection_tolerance_pct" class="form-input" min="1" max="100" placeholder="e.g. 88 (Higher is better)" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="cortex_voltage">Cortex Bio-Voltage (V)</label>
                        <input type="number" step="0.01" id="cortex_voltage" class="form-input" min="0.1" max="10.0" placeholder="e.g. 3.65 (Optimal: 3.0 - 5.0)" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="nanite_count">Nanite Blood Density (cells/&mu;L)</label>
                        <input type="number" id="nanite_count" class="form-input" min="0" max="20000" placeholder="e.g. 6200" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submit-btn">Transmit Bio-Telemetry &amp; Request Clearance</button>
            </form>
        </div>
    </main>

    <footer>
        SECURE INGESTION ENDPOINT // AUTOMATED RDS EVALUATION &amp; CLASSIFICATION
    </footer>

    <script>
        async function verifyAuth() {
            try {
                const res = await fetch('/api/user');
                const data = await res.json();
                if (res.ok && data.status === 'success') {
                    document.getElementById('logged-user').innerText = data.username;
                } else {
                    window.location.href = 'signin.html';
                }
            } catch (err) {
                window.location.href = 'signin.html';
            }
        }

        async function handleLogout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
            } finally {
                window.location.href = 'signin.html';
            }
        }

        document.getElementById('eligibility-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');
            const submitBtn = document.getElementById('submit-btn');

            const payload = {
                synapse_speed_ms: parseInt(document.getElementById('synapse_speed_ms').value, 10),
                rejection_tolerance_pct: parseInt(document.getElementById('rejection_tolerance_pct').value, 10),
                cortex_voltage: parseFloat(document.getElementById('cortex_voltage').value),
                nanite_count: parseInt(document.getElementById('nanite_count').value, 10)
            };

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'CALCULATING CLEARANCE TIER...';

            try {
                const res = await fetch('/api/eligibility/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    alertBox.textContent = `CLEARANCE DETERMINED: ${data.implant_tier} (Score: ${data.score}/100). REDIRECTING...`;
                    alertBox.className = 'alert-box alert-success';
                    alertBox.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = 'clearance-result.html';
                    }, 1200);
                } else {
                    alertBox.textContent = `SUBMISSION ERROR: ${data.message || 'Evaluation rejected.'}`;
                    alertBox.className = 'alert-box alert-error';
                    alertBox.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Transmit Bio-Telemetry & Request Clearance';
                }
            } catch (err) {
                alertBox.textContent = 'GATEWAY CONNECTION ERROR.';
                alertBox.className = 'alert-box alert-error';
                alertBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Transmit Bio-Telemetry & Request Clearance';
            }
        });

        verifyAuth();
    </script>
</body>
</html>
