<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroGrid OS // Operative Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #070913;
            --bg-card: rgba(14, 20, 36, 0.85);
            --cyan: #00f0ff;
            --pink: #ff007f;
            --green: #00ff88;
            --amber: #ffaa00;
            --red: #ff3344;
            --text-main: #d0f7ff;
            --text-dim: #5c7f99;
            --border-glow: rgba(0, 240, 255, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(0, 240, 255, 0.12), transparent 45%),
                radial-gradient(circle at 20% 80%, rgba(255, 0, 127, 0.1), transparent 45%),
                linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.85));
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.6;
        }

        header {
            border-bottom: 1px solid var(--border-glow);
            background: rgba(7, 9, 19, 0.85);
            backdrop-filter: blur(12px);
            padding: 1rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }

        .brand-badge {
            background: var(--pink);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.8rem;
            padding: 0.25rem 0.6rem;
            letter-spacing: 2px;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 12px var(--cyan);
        }

        .nav-link {
            color: var(--text-dim);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .nav-link:hover { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem 1rem;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 6px;
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.12);
            position: relative;
        }

        .auth-card::before {
            content: "AUTHENTICATION // RDS-SESSION";
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--bg-base);
            padding: 0 8px;
            font-size: 0.75rem;
            color: var(--cyan);
            border-left: 2px solid var(--cyan);
            border-right: 2px solid var(--cyan);
            letter-spacing: 2px;
        }

        .auth-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
            text-align: center;
        }

        .auth-title span { color: var(--cyan); text-shadow: 0 0 15px rgba(0, 240, 255, 0.6); }

        .auth-subtitle {
            color: var(--text-dim);
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group { margin-bottom: 1.5rem; }

        .form-label {
            display: block;
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-input {
            width: 100%;
            background: rgba(7, 9, 19, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 4px;
            padding: 0.8rem 1rem;
            color: var(--cyan);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .btn-submit {
            width: 100%;
            background: var(--cyan);
            color: var(--bg-base);
            border: 1px solid var(--cyan);
            padding: 0.9rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: transparent;
            color: var(--cyan);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
        }

        .form-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .form-footer a { color: var(--pink); text-decoration: none; margin-left: 0.3rem; }
        .form-footer a:hover { text-decoration: underline; text-shadow: 0 0 8px var(--pink); }

        .alert-box {
            display: none;
            padding: 0.8rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .alert-error { background: rgba(255, 51, 68, 0.15); border: 1px solid var(--red); color: var(--red); }
        .alert-success { background: rgba(0, 255, 136, 0.15); border: 1px solid var(--green); color: var(--green); }

        footer {
            border-top: 1px solid rgba(0, 240, 255, 0.15);
            padding: 1.2rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-dim);
            background: rgba(7, 9, 19, 0.95);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand">
            <span class="brand-badge">NKCA</span>
            <span class="brand-title">NEUROGRID OS</span>
        </a>
        <nav>
            <a href="signup.html" class="nav-link">Register New Node</a>
        </nav>
    </header>

    <main>
        <div class="auth-card">
            <h1 class="auth-title">Terminal <span>Sign In</span></h1>
            <p class="auth-subtitle">Verify cryptographic credentials with RDS auth cluster</p>

            <div id="alert-box" class="alert-box"></div>

            <form id="signin-form">
                <div class="form-group">
                    <label class="form-label" for="username">Operative Callsign</label>
                    <input type="text" id="username" class="form-input" placeholder="e.g. STE_NOX_01" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Encryption Key / Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••••••" required>
                </div>

                <button type="submit" class="btn-submit" id="submit-btn">Verify &amp; Authenticate</button>
            </form>

            <div class="form-footer">
                Unregistered node signature? <a href="signup.html">Create Enrolment</a>
            </div>
        </div>
    </main>

    <footer>
        SECURE HTTPS SESSION GATEWAY // 3-STRIKE LOCKOUT ENFORCED
    </footer>

    <script>
        const form = document.getElementById('signin-form');
        const alertBox = document.getElementById('alert-box');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            alertBox.style.display = 'none';
            alertBox.className = 'alert-box';
            submitBtn.disabled = true;
            submitBtn.innerText = 'VERIFYING CREDENTIALS...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });

                let data;
                try {
                    data = await response.json();
                } catch (jsonErr) {
                    throw new Error(`Server returned HTTP ${response.status} (${response.statusText})`);
                }

                if (response.ok && data.status === 'success') {
                    alertBox.textContent = 'SESSION GRANTED. INITIALIZING CLEARANCE FORM...';
                    alertBox.classList.add('alert-success');
                    alertBox.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = 'implant-eligibility.html';
                    }, 1200);
                } else {
                    alertBox.textContent = `AUTH REJECTED: ${data.message || 'Access Denied.'}`;
                    alertBox.classList.add('alert-error');
                    alertBox.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Verify & Authenticate';
                }
            } catch (err) {
                alertBox.textContent = `GATEWAY ERROR: ${err.message}`;
                alertBox.classList.add('alert-error');
                alertBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Verify & Authenticate';
            }
        });
    </script>
</body>
</html>
