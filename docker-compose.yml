version: '3.8'

services:
  backend:
    image: ${ECR_REGISTRY}/neurogrid-backend:latest
    container_name: neurogrid_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
    networks:
      - neurogrid-net

  db:
    image: mysql:8.0
    container_name: neurogrid_mysql
    restart: always
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - neurogrid-net

volumes:
  db_data:

networks:
  neurogrid-net:
    driver: bridge