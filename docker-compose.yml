version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Flask Backend Application
  backend:
    image: ${ECR_REGISTRY}/neurogrid-backend:latest
    container_name: neurogrid_backend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:5000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - neurogrid-net

  # System Metrics Exporter for Prometheus Scraping
  node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: neurogrid_node_exporter
    restart: unless-stopped
    logging: *default-logging
    # Host networking and PID mode ensure exact hardware and OS level metrics collection
    pid: host
    network_mode: host
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

networks:
  neurogrid-net:
    driver: bridge