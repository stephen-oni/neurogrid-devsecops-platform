name: "CI/CD Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: "Terraform Provisioning"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    outputs:
      asg_name: ${{ steps.apply.outputs.asg_name }}
      rds_endpoint: ${{ steps.apply.outputs.rds_endpoint }}
      s3_bucket: ${{ steps.apply.outputs.s3_bucket }}
      cloudfront_id: ${{ steps.apply.outputs.cloudfront_id }}
      monitoring_instance_id: ${{ steps.apply.outputs.monitoring_instance_id }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Initialize Terraform Working Directory
        run: terraform init

      - name: Check Terraform Code Formatting
        run: terraform fmt -check

      - name: Validate Terraform Syntax & Configuration
        run: terraform validate

      - name: Apply Infrastructure Changes & Capture Outputs
        id: apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          terraform apply -auto-approve -input=false
          terraform refresh
          ASG=$(terraform output -raw autoscaling_group_name 2>/dev/null || true)
          RDS=$(terraform output -raw rds_endpoint 2>/dev/null || true)
          S3=$(terraform output -raw frontend_s3_bucket_name 2>/dev/null || true)
          CF=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || true)
          MON_ID=$(terraform output -raw monitoring_instance_id 2>/dev/null || true)

          echo "asg_name=$ASG" >> "$GITHUB_OUTPUT"
          echo "rds_endpoint=$RDS" >> "$GITHUB_OUTPUT"
          echo "s3_bucket=$S3" >> "$GITHUB_OUTPUT"
          echo "cloudfront_id=$CF" >> "$GITHUB_OUTPUT"
          echo "monitoring_instance_id=$MON_ID" >> "$GITHUB_OUTPUT"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USER }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}

  deploy-frontend:
    name: "Deploy Frontend to S3 & Invalidate CloudFront"
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync Static Web Assets to S3
        run: |
          S3_BUCKET="${{ needs.terraform.outputs.s3_bucket }}"
          if [ -z "$S3_BUCKET" ]; then
            S3_BUCKET=$(aws s3api list-buckets --query "Buckets[?contains(Name, 'neurogrid-frontend')].Name" --output text | awk '{print $1}')
          fi
          aws s3 sync ./frontend s3://$S3_BUCKET --delete --exclude ".git*" --exclude "*.md"

      - name: Purge CloudFront Edge Cache
        run: |
          CF_ID="${{ needs.terraform.outputs.cloudfront_id }}"
          if [ -z "$CF_ID" ]; then
            CF_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[0].Id" --output text)
          fi
          aws cloudfront create-invalidation --distribution-id $CF_ID --paths "/*"

  build-and-push:
    name: "Build & Push to ECR"
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Authenticate Docker to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/neurogrid-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: "Deploy Backend via Ansible (SSM SSH Tunnel)"
    needs: [terraform, build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup SSH over SSM & Ephemeral Key
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb
          pipx install --include-deps ansible

          mkdir -p ~/.ssh
          ssh-keygen -t rsa -f ~/.ssh/id_rsa -N "" -q

          cat << 'EOF' > ~/.ssh/config
          Host i-* mi-*
            ProxyCommand sh -c "aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters 'portNumber=%p'"
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config ~/.ssh/id_rsa

      - name: Run Ansible Backend Playbook
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          
          # 1. Fallback-safe RDS Endpoint resolution
          RDS_HOST="${{ needs.terraform.outputs.rds_endpoint }}"
          if [ -z "$RDS_HOST" ]; then
            RDS_HOST=$(aws rds describe-db-instances \
              --query "DBInstances[?contains(DBInstanceIdentifier, 'neurogrid')].Endpoint.Address" \
              --output text | awk '{print $1}')
          fi
          
          if [ -z "$RDS_HOST" ]; then
            RDS_HOST=$(aws rds describe-db-instances \
              --query "DBInstances[0].Endpoint.Address" \
              --output text)
          fi

          # Strip port suffix if present
          RDS_HOST=$(echo "$RDS_HOST" | cut -d: -f1)

          echo "Target RDS Endpoint: $RDS_HOST"

          # 2. Extract ASG Target Instances
          ASG_TARGET="${{ needs.terraform.outputs.asg_name }}"
          if [ -z "$ASG_TARGET" ]; then
            ASG_TARGET=$(aws autoscaling describe-auto-scaling-groups \
              --query "AutoScalingGroups[?contains(AutoScalingGroupName, 'neurogrid')].AutoScalingGroupName" \
              --output text | awk '{print $1}')
          fi

          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_TARGET" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)

          PUB_KEY=$(cat ~/.ssh/id_rsa.pub)

          > backend_hosts.ini
          for id in $INSTANCE_IDS; do
            CMD_ID=$(aws ssm send-command \
              --instance-ids "$id" \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=[\"mkdir -p /home/ubuntu/.ssh && chmod 700 /home/ubuntu/.ssh && echo '$PUB_KEY' >> /home/ubuntu/.ssh/authorized_keys && chmod 600 /home/ubuntu/.ssh/authorized_keys\"]" \
              --query "Command.CommandId" \
              --output text)

            aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$id"
            echo "$id" >> backend_hosts.ini
          done

          # 3. Execute Backend Playbook with Verified Parameters
          ansible-playbook -i backend_hosts.ini ansible/deploy-backend.yml \
            -e "ecr_registry=${ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com" \
            -e "rds_host=${RDS_HOST}" \
            -e "db_user=${{ secrets.DB_USER }}" \
            -e "db_password=${{ secrets.DB_PASSWORD }}" \
            -e "db_name=${{ secrets.DB_NAME }}" \
            -e "secret_key=${{ secrets.SECRET_KEY }}" \
            -e "aws_region=${{ secrets.AWS_REGION }}"

  deploy-monitoring:
    name: "Deploy Monitoring via Ansible (SSM SSH Tunnel)"
    needs: [terraform, deploy-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup SSH over SSM & Ephemeral Key
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb
          pipx install --include-deps ansible

          mkdir -p ~/.ssh
          ssh-keygen -t rsa -f ~/.ssh/id_rsa -N "" -q

          cat << 'EOF' > ~/.ssh/config
          Host i-* mi-*
            ProxyCommand sh -c "aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters 'portNumber=%p'"
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config ~/.ssh/id_rsa

      - name: Run Ansible Monitoring Playbook
        run: |
          MON_INSTANCE_ID="${{ needs.terraform.outputs.monitoring_instance_id }}"
          if [ -z "$MON_INSTANCE_ID" ]; then
            MON_INSTANCE_ID=$(aws ec2 describe-instances \
              --filters "Name=tag:Role,Values=monitoring" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text)
          fi

          PUB_KEY=$(cat ~/.ssh/id_rsa.pub)
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$MON_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"mkdir -p /home/ubuntu/.ssh && chmod 700 /home/ubuntu/.ssh && echo '$PUB_KEY' >> /home/ubuntu/.ssh/authorized_keys && chmod 600 /home/ubuntu/.ssh/authorized_keys\"]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$MON_INSTANCE_ID"

          echo "$MON_INSTANCE_ID" > mon_hosts.ini
          ansible-playbook -i mon_hosts.ini ansible/deploy-monitoring.yml