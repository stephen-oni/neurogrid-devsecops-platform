name: "CI/CD Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: "Terraform Provisioning"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    outputs:
      asg_name: ${{ steps.apply.outputs.asg_name }}
      rds_endpoint: ${{ steps.apply.outputs.rds_endpoint }}
      s3_bucket: ${{ steps.apply.outputs.s3_bucket }}
      cloudfront_id: ${{ steps.apply.outputs.cloudfront_id }}
      monitoring_instance_id: ${{ steps.apply.outputs.monitoring_instance_id }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Initialize Terraform Working Directory
        run: terraform init

      - name: Check Terraform Code Formatting
        run: terraform fmt -check

      - name: Validate Terraform Syntax & Configuration
        run: terraform validate

      - name: Apply Infrastructure Changes & Capture Outputs
        id: apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          terraform apply -auto-approve -input=false
          terraform refresh

          ASG=$(terraform output -raw autoscaling_group_name 2>/dev/null || true)
          RDS=$(terraform output -raw rds_endpoint 2>/dev/null || true)
          S3=$(terraform output -raw frontend_s3_bucket_name 2>/dev/null || true)
          CF=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || true)
          MON_ID=$(terraform output -raw monitoring_instance_id 2>/dev/null || true)

          echo "asg_name=$ASG" >> "$GITHUB_OUTPUT"
          echo "rds_endpoint=$RDS" >> "$GITHUB_OUTPUT"
          echo "s3_bucket=$S3" >> "$GITHUB_OUTPUT"
          echo "cloudfront_id=$CF" >> "$GITHUB_OUTPUT"
          echo "monitoring_instance_id=$MON_ID" >> "$GITHUB_OUTPUT"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USER }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}

  deploy-frontend:
    name: "Deploy Frontend to S3 & Invalidate CloudFront"
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync Static Web Assets to S3
        run: |
          S3_BUCKET="${{ needs.terraform.outputs.s3_bucket }}"
          if [ -z "$S3_BUCKET" ]; then
            S3_BUCKET=$(aws s3api list-buckets --query "Buckets[?contains(Name, 'neurogrid-frontend')].Name" --output text | awk '{print $1}')
          fi
          aws s3 sync ./frontend s3://$S3_BUCKET --delete --exclude ".git*" --exclude "*.md"

      - name: Purge CloudFront Edge Cache
        run: |
          CF_ID="${{ needs.terraform.outputs.cloudfront_id }}"
          if [ -z "$CF_ID" ]; then
            CF_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[0].Id" --output text)
          fi
          aws cloudfront create-invalidation --distribution-id $CF_ID --paths "/*"

  build-and-push:
    name: "Build & Push to ECR"
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Authenticate Docker to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/neurogrid-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: "Deploy App to ASG via AWS SSM"
    needs: [terraform, build-and-push, deploy-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Execute Deployment across ASG Nodes via SSM
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          
          # 1. Resolve RDS Endpoint
          RDS_HOST="${{ needs.terraform.outputs.rds_endpoint }}"
          if [ -z "$RDS_HOST" ]; then
            RDS_HOST=$(aws rds describe-db-instances --query "DBInstances[0].Endpoint.Address" --output text)
          fi

          # 2. Resolve ASG Name
          ASG_TARGET="${{ needs.terraform.outputs.asg_name }}"
          if [ -z "$ASG_TARGET" ]; then
            ASG_TARGET=$(aws autoscaling describe-auto-scaling-groups \
              --query "AutoScalingGroups[?contains(AutoScalingGroupName, 'neurogrid')].AutoScalingGroupName" \
              --output text | awk '{print $1}')
          fi

          if [ -z "$RDS_HOST" ] || [ "$RDS_HOST" = "None" ]; then
            echo "CRITICAL: Could not determine RDS Endpoint."
            exit 1
          fi

          tar -czf app-files.tar.gz docker-compose.yml init.sql
          FILE_B64=$(base64 -w 0 app-files.tar.gz)

          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:aws:autoscaling:groupName,Values=${ASG_TARGET}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Application and Node Exporter to ASG" \
            --parameters commands="[
              \"export PATH=\$PATH:/usr/local/bin:/snap/bin\",
              \"cloud-init status --wait\",
              \"mkdir -p /home/ubuntu/app\",
              \"cd /home/ubuntu/app\",
              \"echo '${FILE_B64}' | base64 -d > app-files.tar.gz\",
              \"tar -xzf app-files.tar.gz\",
              \"rm -f app-files.tar.gz\",
              \"printf 'ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com\nRDS_ENDPOINT=${RDS_HOST}\nDB_HOST=${RDS_HOST}\nDB_USER=${{ secrets.DB_USER }}\nDB_PASSWORD=${{ secrets.DB_PASSWORD }}\nDB_NAME=${{ secrets.DB_NAME }}\nSECRET_KEY=${{ secrets.SECRET_KEY }}\n' > .env\",
              \"docker run --rm -v /home/ubuntu/app/init.sql:/init.sql:ro mysql:8.0 sh -c 'mysql -h ${RDS_HOST} -u ${{ secrets.DB_USER }} -p${{ secrets.DB_PASSWORD }} ${{ secrets.DB_NAME }} < /init.sql' || true\",
              \"aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com\",
              \"docker compose pull\",
              \"docker compose up -d --force-recreate --remove-orphans\",
              \"docker image prune -af --filter 'until=24h'\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Dispatched Backend ASG Command ID: $COMMAND_ID"

          while true; do
            STATUS=$(aws ssm list-commands --command-id "$COMMAND_ID" --query "Commands[0].Status" --output text)
            echo "Current Command Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Backend deployment successful across all ASG instances!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Backend deployment failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done

  deploy-monitoring:
    name: "Deploy Monitoring Stack to Dedicated Host"
    needs: [terraform, deploy-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Execute Monitoring Deployment via SSM
        run: |
          MON_INSTANCE_ID="${{ needs.terraform.outputs.monitoring_instance_id }}"
          if [ -z "$MON_INSTANCE_ID" ]; then
            MON_INSTANCE_ID=$(aws ec2 describe-instances \
              --filters "Name=tag:Role,Values=monitoring" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text)
          fi

          echo "Target Monitoring Instance ID: $MON_INSTANCE_ID"

          tar -czf monitoring-files.tar.gz -C monitoring docker-compose.yml prometheus.yml
          MON_FILE_B64=$(base64 -w 0 monitoring-files.tar.gz)

          MON_CMD_ID=$(aws ssm send-command \
            --instance-ids "$MON_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Prometheus & Grafana to Monitoring Host" \
            --parameters commands="[
              \"export PATH=\$PATH:/usr/local/bin:/snap/bin\",
              \"cloud-init status --wait\",
              \"mkdir -p /home/ubuntu/monitoring\",
              \"cd /home/ubuntu/monitoring\",
              \"echo '${MON_FILE_B64}' | base64 -d > monitoring-files.tar.gz\",
              \"tar -xzf monitoring-files.tar.gz\",
              \"rm -f monitoring-files.tar.gz\",
              \"docker compose up -d --remove-orphans\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Dispatched Monitoring Host Command ID: $MON_CMD_ID"

          while true; do
            STATUS=$(aws ssm list-commands --command-id "$MON_CMD_ID" --query "Commands[0].Status" --output text)
            echo "Current Command Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Monitoring stack running cleanly on dedicated host!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Monitoring stack deployment failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done